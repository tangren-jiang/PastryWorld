name: PR Check

on:
  pull_request:
    branches: [ develop ]

jobs:
  pr-check:
    name: Compile Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-PRCheck-${{ hashFiles('Assets/**', 'Packages/**') }}

      - name: Compile Check
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          projectPath: .
          buildName: PastryWorld
          buildsPath: Builds
          buildMethod: PastryWorld.Editor.BuildUtility.CompileCheck
